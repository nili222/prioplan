name: PrioPlan auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v7

      - name: pnpm einrichten
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Website bauen
        run: pnpm run build

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Website hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
